# NOT YET RUN: there is no remote for this repository. Every command below was run locally (see docs/TEST_REPORT.md).
name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, types, lint, contrast, unit tests with coverage, build, artifact checks
        run: pnpm run ci
      - name: Browser tests (Playwright Chromium)
        run: |
          npx playwright-core install --with-deps chromium
          E2E_CHANNEL=chromium pnpm run e2e
          E2E_CHANNEL=chromium pnpm run e2e:dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            docs/e2e-results.json
            docs/screenshots
            coverage
